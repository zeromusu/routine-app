services:
  db:
    image: postgres:15-alpine
    container_name: routine-app-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: routine-app-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d routine-app-db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: routine-app-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_USER: user
      DB_PASSWORD: password
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
